<!-- CADASTRO DA NUTRICIONISTA - INÍCIO -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QUIRI - Cadastro da Nutricionista</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cadastro-container">

        <h1>QUIRI</h1>

        <h2>Cadastro da Nutricionista</h2>

        <form id="formCadastroNutricionista">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
            >

            <label for="cpf">CPF</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                required
            >

            <label for="crn">CRN</label>
            <input
                type="text"
                id="crn"
                name="crn"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                minlength="6"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p id="mensagem"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
<!-- CADASTRO DA NUTRICIONISTA - FIM -->
