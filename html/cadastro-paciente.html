<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QUIRI - Cadastro do Paciente</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="cadastro-paciente-container">

        <h1>QUIRI</h1>

        <h2>Cadastro do Paciente</h2>

        <form id="formCadastroPaciente">

            <label for="nome">Nome completo</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
            >

            <label for="cpf">CPF</label>
            <input
                type="text"
                id="cpf"
                name="cpf"
                required
            >

            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                minlength="6"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p id="mensagemPaciente"></p>

        <p>
            Já possui cadastro?
            <a href="login-paciente.html">Entrar</a>
        </p>

    </main>

    <script src="cadastro-paciente.js"></script>

</body>

</html>
